[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee"
version = "0.1.0"
description = "Reproducible, MRI-only RSNA knee inference mechanics"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "pydicom==3.0.1",
  "torch==2.7.1+cpu",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
ticket37 = [
  "accelerate==1.10.1",
  "huggingface-hub==0.34.4",
  "safetensors==0.6.2",
  "transformers==4.53.3",
]
ticket38 = [
  "huggingface-hub==0.34.4",
  "safetensors==0.6.2",
  "transformers==4.53.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/rsna_knee"]
